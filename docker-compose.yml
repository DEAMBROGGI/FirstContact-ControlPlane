services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: controlplane
      POSTGRES_USER: controlplane
      POSTGRES_PASSWORD: controlplane-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U controlplane -d controlplane"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - controlplane_pg:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      CONTROL_PLANE_DATABASE_URL: postgresql+psycopg://controlplane:controlplane-dev@postgres:5432/controlplane
      CONTROL_PLANE_INTERNAL_TOKEN: local-dev-change-me
      CONTROL_PLANE_PUBLISHER_MODE: disabled
      CONTROL_PLANE_QUARANTINE_ROOT: /var/lib/controlplane/quarantine
      CONTROL_PLANE_MAX_CANDIDATE_BUNDLE_BYTES: 52428800
      CONTROL_PLANE_CODEX_REVIEW_MODE: ${CONTROL_PLANE_CODEX_REVIEW_MODE:-disabled}
      CONTROL_PLANE_CODEX_REVIEW_ACTORS: ${CONTROL_PLANE_CODEX_REVIEW_ACTORS:-}
      CONTROL_PLANE_CODEX_REVIEW_USER_TOKEN: ${CONTROL_PLANE_CODEX_REVIEW_USER_TOKEN:-}
      CONTROL_PLANE_CODEX_REVIEW_TRIGGER_LOGIN: ${CONTROL_PLANE_CODEX_REVIEW_TRIGGER_LOGIN:-}
      CONTROL_PLANE_GITHUB_WEBHOOK_SECRET: ${CONTROL_PLANE_GITHUB_WEBHOOK_SECRET:-}
      CONTROL_PLANE_GITHUB_WEBHOOK_MAX_PAYLOAD_BYTES: ${CONTROL_PLANE_GITHUB_WEBHOOK_MAX_PAYLOAD_BYTES:-1048576}
      CONTROL_PLANE_GITHUB_WEBHOOK_STARTUP_RECONCILE_LIMIT: ${CONTROL_PLANE_GITHUB_WEBHOOK_STARTUP_RECONCILE_LIMIT:-100}
      CONTROL_PLANE_HUMAN_REVIEW_ACTORS: ${CONTROL_PLANE_HUMAN_REVIEW_ACTORS:-}
    volumes:
      - controlplane_quarantine:/var/lib/controlplane
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  ui:
    build: ./ui
    environment:
      VITE_API_BASE: http://localhost:8080
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  controlplane_pg:
  controlplane_quarantine:
