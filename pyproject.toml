[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "firstcontact-control-plane"
version = "0.1.0"
description = "Deterministic CI, admission, publication and review control plane"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "PyJWT[crypto]>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
]

[tool.setuptools.packages.find]
include = ["control_plane*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"control_plane.policies" = ["*.json"]
"control_plane.job_definitions" = ["*.json"]
